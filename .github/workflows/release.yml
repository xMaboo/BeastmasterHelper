name: Build and Release BeastMasterHelper

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read and increment version
        shell: pwsh
        run: |
          $vf = "version.txt"
          $cur = Get-Content $vf
          $p = $cur -split '\.'
          $p[3] = [int]$p[3] + 1
          $nv = $p -join '.'
          Set-Content -Path $vf -Value $nv
          echo "NEWVER=$nv" >> $env:GITHUB_ENV

      - name: Create version.props
        shell: pwsh
        run: |
          "<Project>`n  <PropertyGroup>`n    <Version>$env:NEWVER</Version>`n    <AssemblyVersion>$env:NEWVER</AssemblyVersion>`n  </PropertyGroup>`n</Project>" | Set-Content -Path version.props

      - name: Build plugin
        shell: pwsh
        run: |
          dotnet build src/BeastMasterHelper/BeastMasterHelper.csproj -c Release --nologo -v quiet

      - name: Strip PDBs from zip
        shell: pwsh
        run: |
          $zp = Join-Path (Resolve-Path 'src/BeastMasterHelper/bin/Release/net10.0-windows/BeastMasterHelper') 'latest.zip'
          $at = [System.IO.Compression.ZipFile]::Open($zp, 'Update')
          foreach ($e in $at.Entries) { if ($e.Name -like '*.pdb') { $e.Delete() } }
          $at.Dispose()

      - name: Copy zip to plugins folder
        shell: pwsh
        run: |
          Copy-Item "src/BeastMasterHelper/bin/Release/net10.0-windows/BeastMasterHelper/latest.zip" "plugins/BeastMasterHelper/BeastMasterHelper.zip" -Force

      - name: Update repo.json
        shell: pwsh
        run: |
          $rj = Get-Content -Path repo.json -Raw | ConvertFrom-Json
          foreach ($p in $rj) { if ($p.InternalName -eq 'BeastMasterHelper') { $p.AssemblyVersion = $env:NEWVER; $p.DownloadLinkInstall = 'https://raw.githubusercontent.com/xMaboo/BeastmasterHelper/main/plugins/BeastMasterHelper/BeastMasterHelper.zip'; $p.DownloadLinkUpdate = 'https://raw.githubusercontent.com/xMaboo/BeastmasterHelper/main/plugins/BeastMasterHelper/BeastMasterHelper.zip'; $p.DownloadLinkTesting = 'https://raw.githubusercontent.com/xMaboo/BeastmasterHelper/main/plugins/BeastMasterHelper/BeastMasterHelper.zip' } }
          $rj | ConvertTo-Json -Depth 10 | Set-Content -Path repo.json -Encoding utf8

      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt version.props src/BeastMasterHelper/BeastMasterHelper.csproj plugins/BeastMasterHelper/BeastMasterHelper.zip repo.json
          git commit -m "chore: auto-build v$env:NEWVER [skip ci]" || true
          git push origin main || true
