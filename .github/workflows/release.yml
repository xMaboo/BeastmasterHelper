name: Build and Release BeastMasterHelper

on:
  push:
    tags:
      - 'BeastMasterHelper-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. BeastMasterHelper-v0.10.5.2)'
        required: true
        default: 'BeastMasterHelper-v0.10.5.2'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build plugin
        shell: pwsh
        run: |
          dotnet build src/BeastMasterHelper/BeastMasterHelper.csproj -c Release `
            -p:ContinuousIntegrationBuild=true `
            --nologo -v quiet

      - name: Strip PDBs from packaged zip
        shell: pwsh
        run: |
          $zipPath = Join-Path (Resolve-Path 'src/BeastMasterHelper/bin/Release/net10.0-windows/BeastMasterHelper') 'latest.zip'
          if (-not (Test-Path $zipPath)) {
            Write-Error "Packaged zip not found at $zipPath"
            exit 1
          }
          $tmpPath = $zipPath + '.tmp'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open($zipPath, 'Update')
          try {
            $toRemove = @()
            foreach ($entry in $archive.Entries) {
              if ($entry.Name -like '*.pdb') {
                $toRemove += $entry.FullName
              }
            }
            foreach ($name in $toRemove) {
              $archive.GetEntry($name).Delete()
              Write-Host "Removed PDB: $name"
            }
          } finally {
            $archive.Dispose()
          }
          Write-Host "PDBs stripped from $zipPath"

      - name: Determine tag and asset name
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -eq "") {
            $tag = "${{ github.event.inputs.tag }}"
          }
          Write-Host "Tag: $tag"
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          echo "ASSET_NAME=BeastMasterHelper.zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: BeastMasterHelper ${{ env.RELEASE_TAG }}
          files: src/BeastMasterHelper/bin/Release/net10.0-windows/BeastMasterHelper/latest.zip
          draft: false
          prerelease: false
          generate_release_notes: false
